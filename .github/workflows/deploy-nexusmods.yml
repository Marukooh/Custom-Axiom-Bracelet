name: Deploy to Nexus Mods
run-name: Deploy Nexus Mods version ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Nexus Mods file and mod version (must equal VERSION in build.py)
        required: true
        default: 1.2.0
        type: string
      archive_existing_version:
        description: Archive the currently published file version
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nexusmods-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nexusmods

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Nexus Mods configuration
        shell: bash
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
        run: |
          set -euo pipefail
          test -n "$NEXUSMODS_API_KEY" || { echo 'Missing NEXUSMODS_API_KEY repository secret.' >&2; exit 1; }
          test -n "$NEXUSMODS_FILE_ID" || { echo 'Missing NEXUSMODS_FILE_ID repository variable.' >&2; exit 1; }
          [[ "$NEXUSMODS_FILE_ID" =~ ^[0-9]+$ ]] || { echo 'NEXUSMODS_FILE_ID must be numeric.' >&2; exit 1; }

      - name: Build the pack
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py
          zip="release/Custom Axiom Bracelet v${{ inputs.version }}.zip"
          test -f "$zip" || { echo "No $zip: does VERSION in build.py match the version input?" >&2; exit 1; }

      - name: Upload package to Nexus Mods
        id: nexus-upload
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: release/Custom Axiom Bracelet v${{ inputs.version }}.zip
          version: ${{ inputs.version }}
          display_name: Custom Axiom Bracelet
          description: "For Crimson Desert 2.04.08 with DMM 4.8. One download, seven cards (Combat, Resistances, Regeneration, Movement, Underwater (DLC), Utility, Quality of Life): tick only the buffs you want. Linux/Steam Deck: add winmm=n,b to WINEDLLOVERRIDES."
          category: main
          archive_existing_version: ${{ inputs.archive_existing_version }}
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: false
          update_mod_version: true

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo '## Nexus Mods deployment'
            echo
            echo '- Version: `${{ inputs.version }}`'
            echo '- Previous version archived: `${{ inputs.archive_existing_version }}`'
            echo '- Nexus file version ID: `${{ steps.nexus-upload.outputs.version_id }}`'
          } >> "$GITHUB_STEP_SUMMARY"
